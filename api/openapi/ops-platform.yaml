openapi: 3.0.3
info:
  title: Ops Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /auth/login:
    post:
      summary: Login with local email credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /auth/refresh:
    post:
      summary: Refresh JWT token pair
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /auth/mfa/setup:
    post:
      summary: Start mandatory MFA enrollment from a login challenge
      operationId: setupLoginMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFASetupRequest"
      responses:
        "200":
          description: TOTP enrollment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupEnvelope"
  /auth/mfa/verify:
    post:
      summary: Verify a login TOTP challenge and issue a JWT token pair
      operationId: verifyLoginMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /auth/profile:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalEnvelope"
  /auth/mfa/status:
    get:
      summary: Current user's MFA status and server policy
      operationId: getMFAStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatusEnvelope"
  /auth/mfa/enrollment:
    post:
      summary: Start MFA enrollment for the current authenticated user
      operationId: startMFAEnrollment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP enrollment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupEnvelope"
  /auth/mfa/enable:
    post:
      summary: Verify and enable MFA for the current user
      operationId: enableMFA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA enabled and replacement token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /auth/mfa/disable:
    post:
      summary: Disable MFA for the current user when server policy permits it
      operationId: disableMFA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA disabled and replacement token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /clusters:
    get:
      summary: List configured clusters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cluster list
  /roles:
    get:
      summary: List platform roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListEnvelope"
  /users:
    get:
      summary: List platform users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListEnvelope"
    post:
      summary: Create local platform user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /users/{id}/status:
    put:
      summary: Update platform user status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /users/{id}/roles:
    put:
      summary: Replace platform user roles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRolesRequest"
      responses:
        "200":
          description: User roles updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /users/{id}/mfa:
    delete:
      summary: Reset another user's MFA enrollment
      operationId: resetUserMFA
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: User MFA reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /overview:
    get:
      summary: Get cluster overview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cluster overview
  /namespaces:
    get:
      summary: List namespaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Namespace list
  /nodes:
    get:
      summary: List nodes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Node page
  /resources/yaml:
    get:
      summary: Export Kubernetes resource YAML
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum:
              - node
              - pod
              - deployment
              - statefulset
              - daemonset
              - replicaset
              - job
              - cronjob
              - service
              - ingress
              - configmap
              - pvc
              - pv
              - storageclass
        - name: namespace
          in: query
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource YAML
    put:
      summary: Update Kubernetes resource from YAML
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceYAMLUpdateRequest"
      responses:
        "200":
          description: Resource YAML updated
  /namespaces/{namespace}/pods:
    get:
      summary: List pods
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Pod page
  /namespaces/{namespace}/pods/{pod}:
    get:
      summary: Get pod detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
      responses:
        "200":
          description: Pod detail
    delete:
      summary: Delete pod
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: Delete request submitted
  /namespaces/{namespace}/pods/{pod}/logs:
    get:
      summary: Query pod logs from Kubernetes API
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
        - name: container
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: previous
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Log result
  /namespaces/{namespace}/pods/{pod}/yaml:
    get:
      summary: Export pod YAML
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
      responses:
        "200":
          description: Pod YAML
  /namespaces/{namespace}/deployments:
    get:
      summary: List deployments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Deployment page
  /namespaces/{namespace}/deployments/{name}:
    get:
      summary: Get deployment detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Deployment detail
  /namespaces/{namespace}/deployments/{name}/yaml:
    get:
      summary: Export deployment YAML
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Deployment YAML
  /namespaces/{namespace}/deployments/{name}/scale:
    post:
      summary: Scale deployment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - replicas
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Deployment scaled
  /namespaces/{namespace}/deployments/{name}/restart:
    post:
      summary: Restart deployment by annotating pod template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Deployment restart submitted
  /namespaces/{namespace}/statefulsets:
    get:
      summary: List statefulsets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: StatefulSet page
  /namespaces/{namespace}/daemonsets:
    get:
      summary: List daemonsets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: DaemonSet page
  /namespaces/{namespace}/replicasets:
    get:
      summary: List replicasets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: ReplicaSet page
  /namespaces/{namespace}/jobs:
    get:
      summary: List jobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Job page
  /namespaces/{namespace}/cronjobs:
    get:
      summary: List cronjobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: CronJob page
  /namespaces/{namespace}/services:
    get:
      summary: List services
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Service page
  /namespaces/{namespace}/ingresses:
    get:
      summary: List ingresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ingress page
  /namespaces/{namespace}/configmaps:
    get:
      summary: List configmaps
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: ConfigMap page
  /namespaces/{namespace}/persistentvolumeclaims:
    get:
      summary: List persistent volume claims
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: PVC page
  /persistentvolumes:
    get:
      summary: List persistent volumes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: PV page
  /storageclasses:
    get:
      summary: List storage classes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: StorageClass page
  /namespaces/{namespace}/events:
    get:
      summary: List namespace events
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Event list
  /logs:
    get:
      summary: Query logs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Log result
  /audit/logs:
    get:
      summary: List audit logs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit log list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    Pod:
      name: pod
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
  schemas:
    ResponseEnvelope:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Health"
    Health:
      type: object
      required:
        - status
        - database
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        database:
          type: string
          enum:
            - ok
            - error
        time:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    MFASetupRequest:
      type: object
      required:
        - mfa_token
      properties:
        mfa_token:
          type: string
    MFAVerifyRequest:
      type: object
      required:
        - mfa_token
        - code
      properties:
        mfa_token:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
    MFADisableRequest:
      type: object
      required:
        - password
        - code
      properties:
        password:
          type: string
          format: password
        code:
          type: string
          pattern: "^[0-9]{6}$"
    ResourceYAMLUpdateRequest:
      type: object
      required:
        - kind
        - namespace
        - name
        - yaml
      properties:
        kind:
          type: string
          enum:
            - deployment
            - statefulset
            - daemonset
            - job
            - cronjob
            - service
            - ingress
        namespace:
          type: string
        name:
          type: string
        yaml:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        provider:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
        mfa_enabled:
          type: boolean
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        roles:
          type: array
          items:
            type: string
    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - disabled
    UpdateUserRolesRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
    Principal:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        mfa_enabled:
          type: boolean
        mfa_verified:
          type: boolean
    LoginResult:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/Principal"
        mfa_required:
          type: boolean
        mfa_setup_required:
          type: boolean
        mfa_token:
          type: string
    MFASetupResult:
      type: object
      required:
        - secret
        - provisioning_uri
        - mfa_token
        - expires_in
      properties:
        secret:
          type: string
        provisioning_uri:
          type: string
        mfa_token:
          type: string
        expires_in:
          type: integer
          format: int64
    MFAStatus:
      type: object
      required:
        - enabled
        - required
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
    LoginEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LoginResult"
    PrincipalEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Principal"
    MFASetupEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MFASetupResult"
    MFAStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MFAStatus"
    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"
    UserListEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/User"
    RoleListEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Role"
