      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: PV detail with PVC, Pod, workload, mount and Event associations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PVDetail"
  /storageclasses:
    get:
      summary: List storage classes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: StorageClass page
  /namespaces/{namespace}/events:
    get:
      summary: List namespace events
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - name: involved_kind
          in: query
          schema:
            type: string
        - name: involved_name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Event list
  /logs:
    get:
      summary: Query logs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Log result
  /audit/logs:
    get:
      summary: List audit logs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit log list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    Pod:
      name: pod
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    SecretKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
  schemas:
    ResponseEnvelope:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
    NamespaceSummary:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    NodeSummary:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        cpu_allocatable:
          type: string
        memory_allocatable:
          type: string
        pods_allocatable:
          type: string
        created_at:
          type: string
          format: date-time
    ResourceReference:
      type: object
      properties:
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
    DeclaredResources:
      type: object
      properties:
        cpu:
          type: string
        memory:
          type: string
        ephemeral_storage:
          type: string
        pods:
          type: integer
    ResourceAllocation:
      type: object
      properties:
        requests:
          $ref: "#/components/schemas/DeclaredResources"
        limits:
          $ref: "#/components/schemas/DeclaredResources"
        cpu_request_percent:
          type: number
          format: double
        memory_request_percent:
