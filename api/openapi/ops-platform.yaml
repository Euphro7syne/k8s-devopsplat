openapi: 3.0.3
info:
  title: Ops Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /auth/login:
    post:
      summary: Login with local email credentials
      description: When auth.mfa_enabled is true, password validation is followed by mandatory TOTP enrollment or verification. When false, a valid password issues the JWT token pair without a TOTP challenge, even if the user already has an MFA binding.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /auth/refresh:
    post:
      summary: Refresh JWT token pair
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /auth/mfa/setup:
    post:
      summary: Start mandatory MFA enrollment from a login challenge
      operationId: setupLoginMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFASetupRequest"
      responses:
        "200":
          description: TOTP enrollment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupEnvelope"
  /auth/mfa/verify:
    post:
      summary: Verify a login TOTP challenge and issue a JWT token pair
      operationId: verifyLoginMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "429":
          description: Too many failed MFA verification attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /auth/profile:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalEnvelope"
  /auth/mfa/status:
    get:
      summary: Current user's MFA status and server policy
      operationId: getMFAStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatusEnvelope"
  /auth/mfa/enrollment:
    post:
      summary: Start MFA enrollment for the current authenticated user
      operationId: startMFAEnrollment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP enrollment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupEnvelope"
  /auth/mfa/enable:
    post:
      summary: Verify and enable MFA for the current user
      operationId: enableMFA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA enabled and replacement token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /auth/mfa/disable:
    post:
      summary: Disable MFA for the current user when server policy permits it
      operationId: disableMFA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA disabled and replacement token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
  /clusters:
    get:
      summary: List configured clusters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cluster list
  /roles:
    get:
      summary: List platform roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListEnvelope"
  /users:
    get:
      summary: List platform users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListEnvelope"
    post:
      summary: Create local platform user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /users/{id}/status:
    put:
      summary: Update platform user status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /users/{id}/roles:
    put:
      summary: Replace platform user roles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRolesRequest"
      responses:
        "200":
          description: User roles updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /users/{id}/mfa:
    delete:
      summary: Reset another user's MFA enrollment
      operationId: resetUserMFA
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: User MFA reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
  /overview:
    get:
      summary: Get cluster overview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cluster overview
  /namespaces:
    get:
      summary: List namespaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Namespace list
  /namespaces/{namespace}:
    get:
      summary: Get namespace resource associations and declared resource totals
      description: Returns current Namespace metadata, resource counts, active Pod requests/limits, Pods, top-level Workloads, Services, Ingresses, PVCs and UID-filtered Events. Resource totals are Kubernetes declarations, not metrics-server usage.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Namespace detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NamespaceDetail"
  /nodes:
    get:
      summary: List nodes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Node page
  /nodes/{name}:
    get:
      summary: Get node scheduling and declared resource detail
      description: Returns Node conditions, roles, addresses, taints, system information, capacity/allocatable, effective requests/limits of non-terminal scheduled Pods, associated Pods/Workloads and UID-filtered Events. It does not report realtime CPU or memory usage.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NodeDetail"
  /resources/yaml:
    get:
      summary: Export Kubernetes resource YAML
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum:
              - node
              - namespace
              - pod
              - deployment
              - statefulset
              - daemonset
              - replicaset
              - job
              - cronjob
              - service
              - ingress
              - configmap
              - pvc
              - pv
              - storageclass
        - name: namespace
          in: query
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource YAML
    put:
      summary: Update Kubernetes resource from YAML
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceYAMLUpdateRequest"
      responses:
        "200":
          description: Resource YAML updated
  /namespaces/{namespace}/pods:
    get:
      summary: List pods
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Pod page
  /namespaces/{namespace}/pods/{pod}:
    get:
      summary: Get pod diagnostic detail
      description: Returns runtime state, current and previous container termination details, owner references, resolved controller chain, conditions and scheduling/network metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
      responses:
        "200":
          description: Pod detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PodDetail"
    delete:
      summary: Delete pod
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: Delete request submitted
  /namespaces/{namespace}/pods/{pod}/logs:
    get:
      summary: Query retained pod logs from Kubernetes API
      description: Reads logs still retained by the node for the current container instance or its immediately previous instance. This is not durable cross-Pod history; P1 Loki provides long-term querying.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
        - name: container
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: previous
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: from
          in: query
          description: Return log entries at or after this RFC3339 timestamp.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Log result
  /namespaces/{namespace}/pods/{pod}/logs/follow:
    get:
      summary: Follow pod logs over WebSocket
      description: Connect to /ws/v1 and stream Kubernetes follow=true logs. The client offers subprotocols ops-platform.logs.v1 and bearer.<access-token>; the server negotiates ops-platform.logs.v1. Previous container logs cannot be followed.
      servers:
        - url: /ws/v1
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
        - name: container
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: Number of retained lines sent before following new lines.
          schema:
            type: integer
            default: 200
            maximum: 2000
        - name: from
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "101":
          description: WebSocket stream established; messages use LogStreamMessage.
  /namespaces/{namespace}/pods/{pod}/yaml:
    get:
      summary: Export pod YAML
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
      responses:
        "200":
          description: Pod YAML
  /namespaces/{namespace}/pods/{pod}/restart:
    post:
      summary: Restart a controller-managed pod by deleting it for recreation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Pod"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: Managed pod restart submitted
  /namespaces/{namespace}/deployments:
    get:
      summary: List deployments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Deployment page
  /namespaces/{namespace}/deployments/{name}:
    get:
      summary: Get deployment detail
      description: Returns rollout strategy and conditions plus Deployment-owned ReplicaSets, their Pods, and related Deployment/ReplicaSet/Pod events.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Deployment detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeploymentDetail"
  /namespaces/{namespace}/deployments/{name}/yaml:
    get:
      summary: Export deployment YAML
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Deployment YAML
  /namespaces/{namespace}/deployments/{name}/scale:
    post:
      summary: Scale deployment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - replicas
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Deployment scaled
  /namespaces/{namespace}/deployments/{name}/restart:
    post:
      summary: Restart deployment by annotating pod template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Deployment restart submitted
  /namespaces/{namespace}/statefulsets:
    get:
      summary: List statefulsets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: StatefulSet page
  /namespaces/{namespace}/statefulsets/{name}:
    get:
      summary: Get statefulset detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: StatefulSet detail
  /namespaces/{namespace}/statefulsets/{name}/yaml:
    get:
      summary: Export statefulset YAML
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: StatefulSet YAML
  /namespaces/{namespace}/statefulsets/{name}/scale:
    post:
      summary: Scale statefulset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - replicas
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: StatefulSet scaled
  /namespaces/{namespace}/statefulsets/{name}/restart:
    post:
      summary: Roll out a statefulset restart by annotating its pod template
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: StatefulSet restart submitted
  /namespaces/{namespace}/daemonsets:
    get:
      summary: List daemonsets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: DaemonSet page
  /namespaces/{namespace}/daemonsets/{name}:
    get:
      summary: Get daemonset detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: DaemonSet detail
  /namespaces/{namespace}/daemonsets/{name}/yaml:
    get:
      summary: Export daemonset YAML
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: DaemonSet YAML
  /namespaces/{namespace}/daemonsets/{name}/restart:
    post:
      summary: Roll out a daemonset restart by annotating its pod template
      description: DaemonSets using the OnDelete update strategy return HTTP 409 and must have their managed Pods restarted individually.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: DaemonSet restart submitted
        "409":
          description: DaemonSet uses the OnDelete update strategy
  /namespaces/{namespace}/replicasets:
    get:
      summary: List replicasets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: ReplicaSet page
  /namespaces/{namespace}/replicasets/{name}:
    get:
      summary: Get replicaset detail
      description: Returns the owning Deployment reference, selector, revision, conditions, directly owned Pods, and related ReplicaSet/Pod events. Direct ReplicaSet mutation remains disabled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: ReplicaSet detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReplicaSetDetail"
  /namespaces/{namespace}/jobs:
    get:
      summary: List jobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Job page
  /namespaces/{namespace}/jobs/{name}:
    get:
      summary: Get job detail
      description: Returns execution policy, status conditions, owning CronJob reference, directly owned Pods, and related Job/Pod events. Job deletion and rerun are intentionally not exposed; rerun requires creating a new Job with a new name.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JobDetail"
  /namespaces/{namespace}/cronjobs:
    get:
      summary: List cronjobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: CronJob page
  /namespaces/{namespace}/cronjobs/{name}:
    get:
      summary: Get cronjob detail
      description: Returns schedule policy, Job template policy, directly owned Jobs, descendant Pods, and related CronJob/Job/Pod events. Immediate run and deletion are intentionally not exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: CronJob detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CronJobDetail"
  /namespaces/{namespace}/cronjobs/{name}/suspend:
    post:
      summary: Suspend future cronjob schedules
      description: Sets spec.suspend=true. Already-started Jobs are not stopped. Requires operator/admin, explicit confirmation, and audit.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: CronJob suspended
  /namespaces/{namespace}/cronjobs/{name}/resume:
    post:
      summary: Resume future cronjob schedules
      description: Sets spec.suspend=false. Missed schedules are handled by Kubernetes according to startingDeadlineSeconds. Requires operator/admin, explicit confirmation, and audit.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: CronJob resumed
  /namespaces/{namespace}/services:
    get:
      summary: List services
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Service page
  /namespaces/{namespace}/services/{name}:
    get:
      summary: Get service detail
      description: Returns Service traffic policy and structured ports, EndpointSlice-backed endpoints with legacy Endpoints fallback, selector/targetRef-associated Pods, and related Service/endpoint/Pod events.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServiceDetail"
  /namespaces/{namespace}/ingresses:
    get:
      summary: List ingresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ingress page
  /namespaces/{namespace}/ingresses/{name}:
    get:
      summary: Get ingress detail
      description: Returns default and rule backends, TLS metadata, de-duplicated backend Service details, EndpointSlice-backed endpoints with legacy Endpoints fallback, associated Pods, and related Ingress/Service/endpoint/Pod events. Missing backend Services remain visible for diagnosis.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Ingress detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IngressDetail"
  /namespaces/{namespace}/configmaps:
    get:
      summary: List configmaps
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: ConfigMap page
  /namespaces/{namespace}/secrets:
    get:
      summary: List secret metadata and keys
      description: Restricted to ConfigAdmin and Admin. Secret values are never returned by this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Secret metadata page without values
  /namespaces/{namespace}/secrets/{name}:
    get:
      summary: Get secret metadata and key details
      description: Restricted to ConfigAdmin and Admin. Returns labels, type, immutable state, key names and byte sizes only; Secret values are never returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Secret detail without values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SecretDetail"
  /namespaces/{namespace}/secrets/{name}/values/{key}:
    post:
      summary: Read one decoded secret value
      description: Restricted to Admin and requires confirm=true. This write-like read is audited. Only the requested key is returned; invalid UTF-8 bytes are returned as base64 with encoding=base64.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/SecretKey"
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
            enum:
              - true
      responses:
        "200":
          description: Requested Secret key value
          headers:
            Cache-Control:
              description: Secret plaintext responses are never cacheable.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SecretValueResponse"
  /namespaces/{namespace}/persistentvolumeclaims:
    get:
      summary: List persistent volume claims
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: PVC page
  /namespaces/{namespace}/persistentvolumeclaims/{name}:
    get:
      summary: Get persistent volume claim storage associations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: PVC detail with PV, Pod, workload, mount and Event associations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PVCDetail"
  /persistentvolumes:
