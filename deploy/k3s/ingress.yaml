apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-platform
  namespace: ops-platform
spec:
  rules:
    - host: ops-platform.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ops-server
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: ops-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ops-web
                port:
                  number: 80
