apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-server-config
  namespace: ops-platform
data:
  ops-server.yaml: |
    server:
      mode: release
      listen: "0.0.0.0:8080"
      read_timeout: 15s
      write_timeout: 15s
      shutdown_timeout: 10s
      cors:
        allowed_origins:
          - "*"
        allowed_methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allowed_headers:
          - Authorization
          - Content-Type
          - X-Request-ID

    kubernetes:
      mode: in-cluster
      kubeconfig: ""
      namespace: ops-platform
      cache:
        enabled: true
        resync_period: 10m
        sync_timeout: 15s

    database:
      driver: postgres
      dsn: "set-by-OPS_DATABASE_DSN"
      max_open_conns: 10
      max_idle_conns: 5
      auto_migrate: true

    log:
      level: info
      format: json

    auth:
      jwt_issuer: ops-platform
      jwt_secret: "change-me-placeholder"
      access_token_ttl: 15m
      refresh_token_ttl: 168h
      # TOTP 登录硬开关：true 必须验证动态码；false 仅验证账号密码。
      mfa_enabled: true
      mfa_issuer: ops-platform
      mfa_challenge_ttl: 5m
      mfa_secret_key: "change-me-mfa-secret-key"
      rate_limit:
        enabled: true
        login_max_attempts: 5
        login_window: 5m
        login_block_duration: 15m
        mfa_max_attempts: 5
        mfa_window: 5m
        mfa_block_duration: 15m
      local_admin:
        enabled: true
        username: admin
        email: admin@example.com
        password: "admin123"
