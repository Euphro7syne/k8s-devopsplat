apiVersion: v1
kind: Secret
metadata:
  name: ops-server-secrets
  namespace: ops-platform
type: Opaque
stringData:
  jwt-secret: "change-me-jwt-secret"
  mfa-secret-key: "change-me-mfa-secret-key"
  local-admin-password: "admin123"
  postgres-password: "change-me-postgres-password"
  database-dsn: "postgres://ops_platform:change-me-postgres-password@ops-postgres:5432/ops_platform?sslmode=disable"
