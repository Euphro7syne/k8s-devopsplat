apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-server
  namespace: ops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-server
  template:
    metadata:
      labels:
        app: ops-server
    spec:
      serviceAccountName: ops-platform
      containers:
        - name: ops-server
          image: ops-platform/ops-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-config"
            - "/etc/ops-platform/ops-server.yaml"
          env:
            - name: OPS_DATABASE_DRIVER
              value: postgres
            - name: OPS_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: ops-server-secrets
                  key: database-dsn
            - name: OPS_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ops-server-secrets
                  key: jwt-secret
            - name: OPS_AUTH_MFA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ops-server-secrets
                  key: mfa-secret-key
            - name: OPS_AUTH_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ops-server-secrets
                  key: local-admin-password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ops-platform
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ops-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: ops-server
  namespace: ops-platform
spec:
  selector:
    app: ops-server
  ports:
    - name: http
      port: 8080
      targetPort: http
