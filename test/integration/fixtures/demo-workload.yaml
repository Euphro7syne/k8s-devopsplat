apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: demo-app
  labels:
    app: nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: demo-app
spec:
  selector:
    app: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo
  namespace: demo-app
spec:
  rules:
    - host: nginx-demo.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-demo
                port:
                  name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-demo
  namespace: demo-app
  labels:
    app: log-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-demo
  template:
    metadata:
      labels:
        app: log-demo
    spec:
      containers:
        - name: logger
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while true; do
                echo "level=info msg=demo tick=${i}"
                if [ $((i % 5)) -eq 0 ]; then echo "level=warn msg=demo warning tick=${i}"; fi
                i=$((i + 1))
                sleep 3
              done
---
apiVersion: v1
kind: Service
metadata:
  name: stateful-demo-headless
  namespace: demo-app
spec:
  clusterIP: None
  selector:
    app: stateful-demo
  ports:
    - name: peer
      port: 8080
      targetPort: peer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-demo
  namespace: demo-app
  labels:
    app: stateful-demo
spec:
  serviceName: stateful-demo-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: stateful-demo
  template:
    metadata:
      labels:
        app: stateful-demo
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "stateful worker $(hostname)"
                sleep 10
              done
          ports:
            - name: peer
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone-demo
  namespace: demo-app
  labels:
    app: standalone-demo
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - sleep 3600
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemon-demo
  namespace: demo-app
  labels:
    app: daemon-demo
spec:
  selector:
    matchLabels:
      app: daemon-demo
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: daemon-demo
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "daemon worker $(hostname)"
                sleep 10
              done
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-demo
  namespace: demo-app
  labels:
    app: job-demo
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: job-demo
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - echo "job demo completed"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-demo
  namespace: demo-app
  labels:
    app: cronjob-demo
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app: cronjob-demo
    spec:
      parallelism: 1
      completions: 1
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: cronjob-demo
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - echo "cronjob demo completed"
